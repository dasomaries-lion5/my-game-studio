<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>나의 첫 게임 제작소 - 게임 개발 체험 스튜디오</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <div class="app-shell">
    <!-- 상단 스튜디오 바 -->
    <header class="studio-header">
      <div class="header-left">
        <button id="btn-go-lobby" class="brand-btn" type="button" title="처음 화면으로">
          <span class="brand-icon">🎮</span>
          <span class="brand-text">나의 첫 게임 제작소</span>
        </button>
        <span id="header-game-title" class="game-title-pill">모험을 떠나는 고양이</span>
      </div>
      <div class="header-actions">
        <button id="btn-load-demo" class="util-btn" type="button" title="완성된 샘플 게임 불러오기">✨ 샘플 불러오기</button>
        <button id="btn-save-share" class="util-btn" type="button" title="내 게임 저장 및 공유하기">💾 저장/공유</button>
        <button id="btn-reset-project" class="util-btn" type="button" title="처음부터 새로 만들기">🔄 새로 만들기</button>
        <button id="btn-mute" class="util-btn mute-btn" type="button" title="소리 켜기/끄기">🔊 소리 ON</button>
      </div>
    </header>

    <!-- 7단계 파이프라인 스테퍼 -->
    <nav id="pipeline-stepper" class="pipeline-stepper hidden" aria-label="게임 제작 7단계"></nav>

    <!-- 피코 디렉터 멘토 바 -->
    <section id="mentor-bar" class="mentor-bar hidden" aria-live="polite">
      <div class="mentor-avatar" aria-hidden="true">
        <svg viewBox="0 0 48 48" width="42" height="42">
          <rect x="6" y="10" width="36" height="30" rx="10" fill="#4f46e5" />
          <rect x="11" y="15" width="26" height="17" rx="6" fill="#eef2ff" />
          <circle cx="19" cy="23" r="3" fill="#1e293b" />
          <circle cx="29" cy="23" r="3" fill="#1e293b" />
          <circle cx="20" cy="22" r="1" fill="#ffffff" />
          <circle cx="30" cy="22" r="1" fill="#ffffff" />
          <path d="M20 27 Q24 30 28 27" stroke="#1e293b" stroke-width="2" fill="none" stroke-linecap="round" />
          <line x1="24" y1="10" x2="24" y2="5" stroke="#fbbf24" stroke-width="3" stroke-linecap="round" />
          <circle cx="24" cy="4" r="3" fill="#fbbf24" />
        </svg>
      </div>
      <div class="mentor-content">
        <div class="mentor-meta">
          <span class="mentor-name">피코 디렉터</span>
          <span id="mentor-role" class="role-badge">📋 게임 기획자</span>
        </div>
        <p id="mentor-tip" class="mentor-tip"></p>
      </div>
      <div id="mentor-progress" class="mentor-progress"></div>
    </section>

    <!-- 메인 작업 공간 -->
    <main class="studio-main">
      <div id="lobby-screen" class="lobby-screen"></div>
      <div id="stage-root" class="stage-root hidden"></div>
    </main>

    <!-- 하단 단계 이동 바 -->
    <footer id="studio-footer" class="studio-footer hidden">
      <button id="btn-prev-stage" class="nav-btn nav-prev" type="button">← 이전 단계</button>
      <div id="footer-stage-info" class="footer-stage-info"></div>
      <button id="btn-next-stage" class="nav-btn nav-next" type="button">다음 단계 →</button>
    </footer>
  </div>

  <!-- 공용 모달 오버레이 -->
  <div id="modal-overlay" class="modal-overlay hidden" role="dialog" aria-modal="true" aria-labelledby="modal-title">
    <div class="modal-box">
      <div class="modal-header">
        <h2 id="modal-title" class="modal-title">알림</h2>
        <button id="modal-close" class="modal-close" type="button" aria-label="닫기">✕</button>
      </div>
      <div id="modal-body" class="modal-body"></div>
    </div>
  </div>

  <!-- 토스트 알림 -->
  <div id="toast-container" class="toast-container" aria-live="polite"></div>

  <script src="js/data.js"></script>
  <script src="js/audio.js"></script>
  <script src="js/engine.js"></script>
  <script src="js/stages.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
